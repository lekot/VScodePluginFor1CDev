sonar.organization=lekot
sonar.projectKey=lekot_VScodePluginFor1CDev
sonar.projectName=VScodePluginFor1CDev

# Host
sonar.host.url=https://sonarcloud.io

# Paths
sonar.sources=src,resources/agent-bridge
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Inclusions / Exclusions
sonar.exclusions=out/**,dist/**,node_modules/**,FormatSamples/**,coverage/**,suite-reports/**,smoke-artifacts/**,syntaxes/**,.github/**,scripts/**,test/debug-probe/**,**/*.html
sonar.test.inclusions=test/**/*.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignore rules:
# e1: Rule S5332 (clear-text protocol) for XML namespaces and 1C URIs
# e2: Rule S7739 (do not add then to an object) for SDBL CASE-WHEN-THEN AST nodes
# e3: Rule javascript:S7739 for SDBL CASE-WHEN-THEN AST nodes
# e4: Rule S6544 (Promise-returning method where void expected by DebugSession)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S7739
sonar.issue.ignore.multicriteria.e2.resourceKey=**
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S7739
sonar.issue.ignore.multicriteria.e3.resourceKey=**
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6544
sonar.issue.ignore.multicriteria.e4.resourceKey=**


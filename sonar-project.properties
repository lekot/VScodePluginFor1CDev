sonar.organization=lekot
sonar.projectKey=lekot_VScodePluginFor1CDev
sonar.projectName=VScodePluginFor1CDev

# Host
sonar.host.url=https://sonarcloud.io

# Paths
sonar.sources=src,resources/agent-bridge
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Inclusions / Exclusions
sonar.exclusions=out/**,dist/**,node_modules/**,FormatSamples/**,coverage/**,suite-reports/**,smoke-artifacts/**,syntaxes/**,.github/**,scripts/**,test/debug-probe/**,**/*.html
sonar.test.inclusions=test/**/*.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignore rules:
# S5332 (clear-text protocol): metadata URIs and the listed XML writers/parsers.
# S7739: SDBL CASE-WHEN-THEN AST nodes.
# S6544: Promise-returning method where void is expected by DebugSession.

sonar.organization=lekot
sonar.projectKey=lekot_VScodePluginFor1CDev
sonar.projectName=VScodePluginFor1CDev

# Host
sonar.host.url=https://sonarcloud.io

# Paths
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Inclusions / Exclusions
sonar.exclusions=out/**,dist/**,node_modules/**,FormatSamples/**,coverage/**,suite-reports/**,smoke-artifacts/**,syntaxes/**,.github/**
sonar.test.inclusions=test/**/*.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

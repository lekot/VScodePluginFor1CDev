<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="${csp}">
    <title>Roles and Rights Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--vscode-font-family);
            font-size: var(--vscode-font-size);
            color: var(--vscode-foreground);
            background-color: var(--vscode-editor-background);
            padding: 16px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        input[type="checkbox"] {
            cursor: pointer;
        }

        input[type="text"] {
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
            padding: 4px 8px;
            border-radius: 2px;
            outline: none;
            min-width: 200px;
        }

        input[type="text"]:focus {
            border-color: var(--vscode-focusBorder);
        }

        select {
            background: var(--vscode-dropdown-background);
            color: var(--vscode-dropdown-foreground);
            border: 1px solid var(--vscode-dropdown-border);
            padding: 4px 8px;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--vscode-focusBorder);
        }

        .table-container {
            flex: 1;
            overflow: auto;
            border: 1px solid var(--vscode-panel-border);
            border-radius: 2px;
            position: relative;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--vscode-editor-background);
        }

        th {
            background: var(--vscode-editorGroupHeader-tabsBackground);
            color: var(--vscode-foreground);
            font-weight: 600;
            padding: 8px 12px;
            text-align: left;
            border-bottom: 2px solid var(--vscode-panel-border);
            border-right: 1px solid var(--vscode-panel-border);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }

        th:first-child {
            position: sticky;
            left: 0;
            z-index: 11;
            min-width: 250px;
            max-width: 400px;
        }

        th.right-column {
            text-align: center;
            min-width: 80px;
        }

        tbody tr {
            border-bottom: 1px solid var(--vscode-panel-border);
        }

        tbody tr:hover {
            background: var(--vscode-list-hoverBackground);
        }

        td {
            padding: 8px 12px;
            border-right: 1px solid var(--vscode-panel-border);
        }

        td:first-child {
            position: sticky;
            left: 0;
            background: var(--vscode-editor-background);
            font-weight: 500;
            z-index: 1;
            min-width: 250px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        tbody tr:hover td:first-child {
            background: var(--vscode-list-hoverBackground);
        }

        td.checkbox-cell {
            text-align: center;
            padding: 4px;
        }

        td.checkbox-cell input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }

        .actions {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--vscode-panel-border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        button {
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border: none;
            padding: 6px 14px;
            border-radius: 2px;
            cursor: pointer;
            font-size: var(--vscode-font-size);
            font-family: var(--vscode-font-family);
        }

        button:hover {
            background: var(--vscode-button-hoverBackground);
        }

        button:active {
            opacity: 0.9;
        }

        button.secondary {
            background: var(--vscode-button-secondaryBackground);
            color: var(--vscode-button-secondaryForeground);
        }

        button.secondary:hover {
            background: var(--vscode-button-secondaryHoverBackground);
        }

        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--vscode-descriptionForeground);
        }

        .empty-state p {
            margin-bottom: 8px;
        }

        .object-type {
            color: var(--vscode-descriptionForeground);
            font-size: 0.9em;
            margin-left: 8px;
        }

        .parent-hint {
            color: var(--vscode-descriptionForeground);
            font-size: 0.85em;
            display: block;
            margin-top: 2px;
        }

        .rls-section {
            margin-bottom: 12px;
        }

        .rls-section label {
            display: block;
            margin-bottom: 6px;
            color: var(--vscode-descriptionForeground);
            font-size: 12px;
        }

        .rls-textarea {
            width: 100%;
            min-height: 72px;
            resize: vertical;
            font-family: var(--vscode-editor-font-family);
            font-size: 12px;
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border: 1px solid var(--vscode-input-border);
            border-radius: 2px;
            padding: 8px;
        }

        .load-error-banner {
            display: none;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 2px;
            background: var(--vscode-inputValidation-errorBackground);
            color: var(--vscode-inputValidation-errorForeground);
            border: 1px solid var(--vscode-inputValidation-errorBorder);
            font-size: 12px;
        }

        .table-loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--vscode-editor-background);
            opacity: 0.92;
            z-index: 20;
        }

        .table-loading-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--vscode-descriptionForeground);
            font-size: 13px;
        }

        .loading-spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--vscode-widget-border);
            border-top-color: var(--vscode-progressBar-background);
            border-radius: 50%;
            animation: rights-editor-spin 0.8s linear infinite;
        }

        @keyframes rights-editor-spin {
            to { transform: rotate(360deg); }
        }

        .host-message-banner {
            display: none;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .host-message-banner--error {
            background: var(--vscode-inputValidation-errorBackground);
            color: var(--vscode-inputValidation-errorForeground);
            border: 1px solid var(--vscode-inputValidation-errorBorder);
        }

        .host-message-banner--info {
            background: var(--vscode-inputValidation-infoBackground);
            color: var(--vscode-inputValidation-infoForeground);
            border: 1px solid var(--vscode-inputValidation-infoBorder);
        }

        .attr-expander {
            display: inline-block;
            width: 16px;
            cursor: pointer;
            user-select: none;
            color: var(--vscode-foreground);
            font-size: 10px;
            margin-right: 4px;
        }

        .attr-expander:hover {
            color: var(--vscode-textLink-activeForeground);
        }

        .attr-status-hint {
            color: var(--vscode-descriptionForeground);
            font-size: 0.85em;
            font-style: italic;
        }

        .attr-status-error {
            color: var(--vscode-errorForeground);
            font-size: 0.85em;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="hostMessageBanner" class="host-message-banner host-message-banner--error" aria-live="polite"></div>

    <div class="header">
        <h1 id="roleTitle">Rights Editor</h1>
        <div class="controls">
            <div class="control-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="showAllToggle">
                    <span>Show All Objects</span>
                </label>
            </div>
            <div class="control-group">
                <input type="text" id="searchInput" placeholder="Search objects...">
                <span id="searchStatus" class="attr-status-hint" style="display: none; margin-left: 6px;"></span>
            </div>
            <div class="control-group">
                <label for="typeFilter">Type:</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                </select>
            </div>
        </div>
    </div>

    <div id="metadataLoadError" class="load-error-banner"></div>

    <div class="rls-section">
        <label for="rlsTemplates">RLS restriction templates (Rights.xml; editable, saved with Save)</label>
        <textarea id="rlsTemplates" class="rls-textarea" spellcheck="false" placeholder="No restrictionTemplate blocks in Rights.xml"></textarea>
    </div>

    <div class="table-container">
        <div id="tableLoadingOverlay" class="table-loading-overlay" style="display: none;">
            <div class="table-loading-inner">
                <span class="loading-spinner" aria-hidden="true"></span>
                <span>Loading metadata…</span>
            </div>
        </div>
        <table id="rightsTable">
            <thead>
                <tr id="headerRow">
                    <th>Object</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No objects match the current filter.</p>
            <p>Try adjusting your search or enabling "Show All Objects".</p>
        </div>
    </div>

    <div class="actions">
        <button id="cancelButton" class="secondary">Cancel</button>
        <button id="saveButton">Save</button>
    </div>

    <script nonce="${nonce}">
        (function() {
            const vscode = acquireVsCodeApi();
            
            // State management
            let roleData = null;
            let allObjects = [];
            let tableInitialLoading = false;
            let filterState = {
                showAll: false,
                searchQuery: '',
                typeFilter: ''
            };
            var currentSessionId = '';
            var currentDataRevision = 0;
            var isFirstTableReady = false;
            var expandedObjects = new Set();
            var searchQuerySeq = 0;
            var requestSeq = 0;

            /** Set from extension `objectsLoaded` when no configuration path — Save is disabled. */
            let saveDisabledByHost = false;
            var hostBannerClearTimer = null;

            var TABLE_RENDER_CHUNK = 120;
            var renderTableSeq = 0;
            var searchDebounceTimer = null;

            function setLoadingOverlay(visible) {
                var el = document.getElementById('tableLoadingOverlay');
                if (el) {
                    el.style.display = visible ? 'flex' : 'none';
                }
            }

            function setMetadataLoadError(message) {
                var banner = document.getElementById('metadataLoadError');
                if (!banner) {
                    return;
                }
                if (message) {
                    banner.textContent = message;
                    banner.style.display = 'block';
                } else {
                    banner.textContent = '';
                    banner.style.display = 'none';
                }
            }

            function syncSaveButtonState() {
                var btn = document.getElementById('saveButton');
                if (btn) {
                    btn.disabled = saveDisabledByHost === true;
                }
            }

            function clearHostBannerTimer() {
                if (hostBannerClearTimer) {
                    clearTimeout(hostBannerClearTimer);
                    hostBannerClearTimer = null;
                }
            }

            function showHostBanner(kind, text, autoClearMs) {
                var el = document.getElementById('hostMessageBanner');
                if (!el) {
                    return;
                }
                clearHostBannerTimer();
                el.textContent = text || '';
                el.className = 'host-message-banner host-message-banner--' + (kind === 'info' ? 'info' : 'error');
                el.style.display = text ? 'block' : 'none';
                if (text && typeof autoClearMs === 'number' && autoClearMs > 0) {
                    hostBannerClearTimer = setTimeout(function () {
                        hideHostBanner();
                    }, autoClearMs);
                }
            }

            function hideHostBanner() {
                clearHostBannerTimer();
                var el = document.getElementById('hostMessageBanner');
                if (el) {
                    el.textContent = '';
                    el.style.display = 'none';
                }
            }

            function beginRightsEditorSession() {
                if (roleData && roleData.name) {
                    document.getElementById('roleTitle').textContent = 'Rights: ' + roleData.name;
                }
                var ta = document.getElementById('rlsTemplates');
                if (ta && roleData) {
                    ta.value = roleData.restrictionTemplatesText || '';
                }
                setMetadataLoadError('');
                if (tableInitialLoading) {
                    setLoadingOverlay(true);
                } else {
                    setLoadingOverlay(false);
                    initializeUI();
                    renderTable();
                }
                syncSaveButtonState();
            }

            // Initialize event listeners
            document.getElementById('showAllToggle').addEventListener('change', handleShowAllToggle);
            document.getElementById('searchInput').addEventListener('input', handleSearchInput);
            document.getElementById('typeFilter').addEventListener('change', handleTypeFilter);
            document.getElementById('saveButton').addEventListener('click', handleSave);
            document.getElementById('cancelButton').addEventListener('click', handleCancel);
            document.getElementById('tableBody').addEventListener('click', function(e) {
                var expander = e.target.closest('.attr-expander');
                var retry = e.target.closest('.attr-status-error');
                var targetObjFullName = expander ? expander.getAttribute('data-object') : (retry ? retry.getAttribute('data-object') : null);
                if (!targetObjFullName) return;

                var obj = allObjects.find(function(o) { return o.fullName === targetObjFullName; });
                if (!obj) return;

                if (expander) {
                    if (expandedObjects.has(targetObjFullName)) {
                        expandedObjects.delete(targetObjFullName);
                        renderTable();
                        return;
                    }
                    expandedObjects.add(targetObjFullName);
                }

                if (obj.attributesState === 'loaded') {
                    renderTable();
                    return;
                }

                obj.attributesState = 'loading';
                obj.attributesError = undefined;
                renderTable();

                requestSeq++;
                vscode.postMessage({
                    command: 'loadObjectAttributes',
                    data: {
                        sessionId: currentSessionId,
                        requestId: 'attr-req-' + requestSeq,
                        objectFullName: targetObjFullName
                    }
                });
            });

            // Ctrl+S to save
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    handleSave();
                }
            });

            // Extension → webview: metadata rows use command `objectsLoaded` only (no `initialize`).
            window.addEventListener('message', event => {
                const message = event.data;
                const data = message.data || {};
                
                switch (message.command) {
                    case 'requestSavePayload': {
                        var rid = data.requestId;
                        var rlsTa = document.getElementById('rlsTemplates');
                        var rlsText = rlsTa ? rlsTa.value : '';
                        vscode.postMessage({
                            command: 'savePayload',
                            data: {
                                requestId: rid,
                                restrictionTemplatesText: rlsText
                            }
                        });
                        break;
                    }

                    case 'objectsLoaded': /*
                        allObjects = data.objects || [];
                        if (Array.isArray(data.uiRights)) {
                            roleData.uiRights = data.uiRights;
                        }
                        tableInitialLoading = false;
                        saveDisabledByHost = data.saveDisabled === true;
                        setLoadingOverlay(false);
                        if (data.error) {
                            setMetadataLoadError(data.error);
                        } else {
                            setMetadataLoadError('');
                        }
                        initializeUI();
                        renderTable();
                        syncSaveButtonState();
                        */ {
                        var incomingSessionId = data.sessionId;
                        var incomingRevision = data.dataRevision || 0;
                        if (incomingSessionId) {
                            if (currentSessionId && incomingSessionId !== currentSessionId) {
                                currentSessionId = incomingSessionId;
                                expandedObjects.clear();
                                isFirstTableReady = false;
                            } else if (!currentSessionId) {
                                currentSessionId = incomingSessionId;
                            }
                        }
                        currentDataRevision = incomingRevision;

                        if (Array.isArray(data.uiRights)) {
                            roleData.uiRights = data.uiRights;
                        }

                        if (data.phase === 'initial' || !allObjects || allObjects.length === 0) {
                            allObjects = data.objects || [];
                        } else {
                            var incoming = data.objects || [];
                            var existingByFullName = {};
                            for (var i = 0; i < allObjects.length; i++) {
                                existingByFullName[allObjects[i].fullName] = allObjects[i];
                            }
                            for (var j = 0; j < incoming.length; j++) {
                                var inObj = incoming[j];
                                var existing = existingByFullName[inObj.fullName];
                                if (!existing) {
                                    allObjects.push(inObj);
                                    existingByFullName[inObj.fullName] = inObj;
                                } else {
                                    existing.displayName = inObj.displayName;
                                    existing.hasRights = inObj.hasRights;
                                }
                            }
                            allObjects.sort(function(a, b) {
                                var rankA = a.rowKind === 'configurationRoot' ? 0 : (a.rowKind === 'attribute' ? 2 : 1);
                                var rankB = b.rowKind === 'configurationRoot' ? 0 : (b.rowKind === 'attribute' ? 2 : 1);
                                if (rankA !== rankB) return rankA - rankB;
                                var tc = a.type.localeCompare(b.type);
                                if (tc !== 0) return tc;
                                return a.name.localeCompare(b.name);
                            });
                        }

                        tableInitialLoading = false;
                        saveDisabledByHost = data.saveDisabled === true;
                        setLoadingOverlay(false);
                        if (data.error) {
                            setMetadataLoadError(data.error);
                        } else {
                            setMetadataLoadError('');
                        }
                        initializeUI();
                        renderTable();
                        syncSaveButtonState();
                        break;
                    }

                    case 'loadObjectAttributesResult': {
                        if (data.sessionId && data.sessionId !== currentSessionId) {
                            break;
                        }
                        var targetName = data.objectFullName;
                        var target = allObjects.find(function(o) { return o.fullName === targetName; });
                        if (target) {
                            if (data.state === 'loaded') {
                                target.attributesState = 'loaded';
                                target.attributes = data.attributes || [];
                            } else {
                                target.attributesState = 'failed';
                                target.attributesError = data.error || 'Failed to load attributes';
                            }
                            if (expandedObjects.has(targetName)) {
                                renderTable();
                            }
                        }
                        break;
                    }

                    case 'searchProgress': {
                        if (data.sessionId && data.sessionId !== currentSessionId) break;
                        if (data.queryId && data.queryId < searchQuerySeq) break;
                        var searchStatusEl = document.getElementById('searchStatus');
                        if (searchStatusEl) {
                            if (data.state === 'running') {
                                searchStatusEl.textContent = '(searching attributes...)';
                                searchStatusEl.style.display = 'inline';
                            } else if (data.state === 'incomplete') {
                                searchStatusEl.textContent = '(search incomplete)';
                                searchStatusEl.style.display = 'inline';
                            } else {
                                searchStatusEl.textContent = '';
                                searchStatusEl.style.display = 'none';
                            }
                        }
                        if (Array.isArray(data.matchingObjectNames) && data.matchingObjectNames.length > 0) {
                            for (var m = 0; m < data.matchingObjectNames.length; m++) {
                                expandedObjects.add(data.matchingObjectNames[m]);
                            }
                            renderTable();
                        }
                        break;
                    }
                    
                    case 'updateSuccess':
                        // Rights updated successfully
                        break;
                    
                    case 'updateError': {
                        var ue = Array.isArray(data.errors) ? data.errors.join('\n') : (data.message || 'Unknown error');
                        showHostBanner('error', 'Error updating rights: ' + ue, 14000);
                        break;
                    }

                    case 'validationError': {
                        var ve = Array.isArray(data.errors) ? data.errors.join('\n') : JSON.stringify(data);
                        showHostBanner('error', 'Validation issue(s): ' + ve, 0);
                        break;
                    }

                    case 'validationCancelled':
                        hideHostBanner();
                        if (data.message) {
                            showHostBanner('info', data.message, 8000);
                        }
                        break;

                    case 'saveError':
                        showHostBanner('error', 'Save failed: ' + (data.message || 'Unknown error'), 16000);
                        break;

                    case 'error':
                        showHostBanner('error', data.message || 'Unknown error', 14000);
                        break;
                }
            });

            function initializeUI() {
                // Set role title
                if (roleData && roleData.name) {
                    document.getElementById('roleTitle').textContent = 'Rights: ' + roleData.name;
                }

                // Populate type filter (reset options except "All")
                const typeFilter = document.getElementById('typeFilter');
                while (typeFilter.options.length > 1) {
                    typeFilter.remove(1);
                }
                const types = [...new Set(allObjects.map(obj => obj.type))].sort();
                types.forEach(type => {
                    const option = document.createElement('option');
                    option.value = type;
                    option.textContent = type;
                    typeFilter.appendChild(option);
                });
                typeFilter.value = filterState.typeFilter || '';

                // Build header row with right types
                const rightTypes = roleData && Array.isArray(roleData.uiRights) ? roleData.uiRights : [];

                const headerRow = document.getElementById('headerRow');
                while (headerRow.cells.length > 1) {
                    headerRow.deleteCell(headerRow.cells.length - 1);
                }
                rightTypes.forEach(right => {
                    const th = document.createElement('th');
                    th.className = 'right-column';
                    th.textContent = right.label;
                    th.title = right.xmlName;
                    headerRow.appendChild(th);
                });
            }

            function appendRightsTableRow(tableBody, obj, rightTypes) {
                const tr = document.createElement('tr');
                const tdName = document.createElement('td');
                const displayName = escapeHtml(obj.displayName || obj.name);
                const type = escapeHtml(obj.type);
                var parentLine = '';
                if (obj.parentLabel) {
                    parentLine = '<span class="parent-hint">' + escapeHtml(obj.parentLabel) + '</span>';
                }
                var expanderHtml = '';
                var canHaveAttributes = ['Catalog', 'Document', 'DataProcessor', 'ChartOfCharacteristicTypes'].includes(obj.type) && obj.rowKind !== 'attribute' && obj.rowKind !== 'configurationRoot';
                if (canHaveAttributes) {
                    var isExpanded = expandedObjects.has(obj.fullName);
                    var icon = isExpanded ? '▼' : '▶';
                    expanderHtml = '<span class="attr-expander" data-object="' + escapeHtml(obj.fullName) + '">' + icon + '</span>';
                }
                var statusHtml = '';
                if (obj.attributesState === 'loading') {
                    statusHtml = ' <span class="attr-status-hint">(loading attributes...)</span>';
                } else if (obj.attributesState === 'failed') {
                    statusHtml = ' <span class="attr-status-error" data-object="' + escapeHtml(obj.fullName) + '" title="' + escapeHtml(obj.attributesError || '') + '">(retry)</span>';
                }
                if (obj.rowKind === 'attribute') {
                    tdName.style.paddingLeft = '28px';
                }
                tdName.innerHTML = expanderHtml + displayName + '<span class="object-type">(' + type + ')</span>' + parentLine + statusHtml;
                tdName.title = obj.fullName;
                tr.appendChild(tdName);

                const objectRights = roleData.rights[obj.fullName] || {};
                const metadataType = (obj.fullName || '').split('.')[0];
                rightTypes.forEach(function(right) {
                    const td = document.createElement('td');
                    td.className = 'checkbox-cell';
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = objectRights[right.key] || false;
                    checkbox.disabled = !right.applicableTo.includes(metadataType);
                    checkbox.dataset.object = obj.fullName;
                    checkbox.dataset.right = right.key;
                    checkbox.addEventListener('change', handleCheckboxChange);
                    td.appendChild(checkbox);
                    tr.appendChild(td);
                });
                tableBody.appendChild(tr);
            }

            function notifyRenderProgress(busy, rowCount) {
                if (!busy && !isFirstTableReady) {
                    isFirstTableReady = true;
                    vscode.postMessage({
                        command: 'tableRenderProgress',
                        data: {
                            sessionId: currentSessionId,
                            dataRevision: currentDataRevision,
                            firstTableReady: true,
                            busy: false,
                            rowCount: rowCount
                        }
                    });
                    return;
                }
                vscode.postMessage({
                    command: 'tableRenderProgress',
                    data: {
                        sessionId: currentSessionId,
                        dataRevision: currentDataRevision,
                        busy: busy,
                        rowCount: rowCount
                    }
                });
            }

            function renderTable() {
                if (!roleData) {
                    return;
                }
                renderTableSeq += 1;
                const seq = renderTableSeq;
                const filteredObjects = applyFilters();
                const tableBody = document.getElementById('tableBody');
                const emptyState = document.getElementById('emptyState');

                tableBody.innerHTML = '';

                if (filteredObjects.length === 0) {
                    emptyState.style.display = 'block';
                    notifyRenderProgress(false, 0);
                    return;
                }

                emptyState.style.display = 'none';

                const rightTypes = roleData && Array.isArray(roleData.uiRights) ? roleData.uiRights : [];

                if (filteredObjects.length <= TABLE_RENDER_CHUNK) {
                    for (let i = 0; i < filteredObjects.length; i++) {
                        appendRightsTableRow(tableBody, filteredObjects[i], rightTypes);
                    }
                    notifyRenderProgress(false, filteredObjects.length);
                    return;
                }

                notifyRenderProgress(true, filteredObjects.length);

                let idx = 0;
                function pump() {
                    if (seq !== renderTableSeq) {
                        notifyRenderProgress(false, filteredObjects.length);
                        return;
                    }
                    const end = Math.min(idx + TABLE_RENDER_CHUNK, filteredObjects.length);
                    for (; idx < end; idx++) {
                        appendRightsTableRow(tableBody, filteredObjects[idx], rightTypes);
                    }
                    if (idx < filteredObjects.length) {
                        requestAnimationFrame(pump);
                    } else {
                        notifyRenderProgress(false, filteredObjects.length);
                    }
                }
                requestAnimationFrame(pump);
            }

            function applyFilters() {
                var query = filterState.searchQuery ? filterState.searchQuery.toLowerCase() : '';
                var type = filterState.typeFilter || '';
                var showAll = Boolean(filterState.showAll);

                function hasAssignedRights(obj) {
                    var r = roleData.rights[obj.fullName];
                    return Boolean(r && Object.values(r).some(function(v) { return v === true; }));
                }

                function matchesQuery(obj) {
                    if (!query) return true;
                    return (obj.name && obj.name.toLowerCase().includes(query)) ||
                           (obj.displayName && obj.displayName.toLowerCase().includes(query)) ||
                           (obj.fullName && obj.fullName.toLowerCase().includes(query)) ||
                           (obj.parentLabel && obj.parentLabel.toLowerCase().includes(query));
                }

                function matchesType(obj) {
                    if (!type) return true;
                    return obj.type === type;
                }

                var filtered = [];
                var seenFullNames = new Set();

                function pushRow(r) {
                    if (!seenFullNames.has(r.fullName)) {
                        seenFullNames.add(r.fullName);
                        filtered.push(r);
                    }
                }
                for (var i = 0; i < allObjects.length; i++) {
                    var obj = allObjects[i];

                    if (obj.rowKind === 'attribute') {
                        if ((showAll || hasAssignedRights(obj)) && matchesType(obj) && matchesQuery(obj)) {
                            pushRow(obj);
                        }
                        continue;
                    }

                    var parentRights = showAll || hasAssignedRights(obj);
                    var parentQuery = matchesQuery(obj);
                    var parentType = matchesType(obj);

                    var isExpanded = expandedObjects.has(obj.fullName);
                    var loadedAttrs = (obj.attributesState === 'loaded' && Array.isArray(obj.attributes)) ? obj.attributes : [];

                    var matchingAttrs = [];
                    if (isExpanded || query) {
                        for (var a = 0; a < loadedAttrs.length; a++) {
                            var attr = loadedAttrs[a];
                            var attrRights = showAll || hasAssignedRights(attr);
                            var attrQuery = matchesQuery(attr);
                            if (attrRights && (parentQuery || attrQuery)) {
                                matchingAttrs.push(attr);
                            }
                        }
                    }

                    var showParent = parentType && ((parentRights && parentQuery) || matchingAttrs.length > 0);
                    if (showParent) {
                        pushRow(obj);
                        if (isExpanded) {
                            for (var k = 0; k < loadedAttrs.length; k++) {
                                var child = loadedAttrs[k];
                                var childRights = showAll || hasAssignedRights(child);
                                if (childRights && (parentQuery || matchesQuery(child))) {
                                    pushRow(child);
                                }
                            }
                        }
                    }
                }

                return filtered;
            }

            function handleShowAllToggle(event) {
                filterState.showAll = event.target.checked;
                vscode.postMessage({
                    command: 'toggleFilter',
                    data: { showAll: filterState.showAll }
                });
                requestAnimationFrame(function() {
                    renderTable();
                });
            }

            function handleSearchInput(event) {
                filterState.searchQuery = event.target.value;
                if (!filterState.searchQuery || filterState.searchQuery.trim().length < 2) {
                    var sEl = document.getElementById('searchStatus');
                    if (sEl) {
                        sEl.textContent = '';
                        sEl.style.display = 'none';
                    }
                }
                searchQuerySeq++;
                vscode.postMessage({
                    command: 'search',
                    data: {
                        sessionId: currentSessionId,
                        queryId: searchQuerySeq,
                        query: filterState.searchQuery,
                        type: filterState.typeFilter
                    }
                });
                if (searchDebounceTimer) {
                    clearTimeout(searchDebounceTimer);
                }
                searchDebounceTimer = setTimeout(function() {
                    searchDebounceTimer = null;
                    requestAnimationFrame(renderTable);
                }, 200);
            }

            function handleTypeFilter(event) {
                filterState.typeFilter = event.target.value;
                vscode.postMessage({
                    command: 'filterByType',
                    data: { type: filterState.typeFilter }
                });
                requestAnimationFrame(function() {
                    renderTable();
                });
            }

            function handleCheckboxChange(event) {
                const objectName = event.target.dataset.object;
                const rightType = event.target.dataset.right;
                const value = event.target.checked;

                // Update local state
                if (!roleData.rights[objectName]) {
                    roleData.rights[objectName] = {};
                }
                roleData.rights[objectName][rightType] = value;

                // Apply dependency rules
                applyDependencyRules(objectName, rightType, value);

                // Send update to extension
                vscode.postMessage({
                    command: 'updateRight',
                    data: {
                        objectName: objectName,
                        rightType: rightType,
                        value: value
                    }
                });

                // Re-render to show dependency updates (chunked if large)
                requestAnimationFrame(renderTable);
            }

            function applyDependencyRules(objectName, rightType, value) {
                const rights = roleData.rights[objectName];
                const definitions = Array.isArray(roleData.uiRights) ? roleData.uiRights : [];

                if (value) {
                    const visited = new Set();
                    function enableDependencies(key) {
                        if (visited.has(key)) return;
                        visited.add(key);
                        const definition = definitions.find(candidate => candidate.key === key);
                        (definition ? definition.dependencies : []).forEach(dependency => {
                            rights[dependency] = true;
                            enableDependencies(dependency);
                        });
                    }
                    enableDependencies(rightType);
                } else {
                    definitions.filter(definition => definition.clearedBy.includes(rightType))
                        .forEach(definition => { rights[definition.key] = false; });
                }
            }

            function handleSave() {
                if (saveDisabledByHost) {
                    return;
                }
                var ta = document.getElementById('rlsTemplates');
                var rls = ta ? ta.value : '';
                vscode.postMessage({
                    command: 'save',
                    data: {
                        roleData: roleData,
                        restrictionTemplatesText: rls
                    }
                });
            }

            function handleCancel() {
                vscode.postMessage({
                    command: 'cancel'
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Request initial data
            vscode.postMessage({ command: 'ready' });
        })();
    </script>
</body>

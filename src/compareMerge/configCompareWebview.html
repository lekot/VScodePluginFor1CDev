<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="${csp}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сравнение конфигураций</title>
  <style nonce="${nonce}">
    :root {
      color-scheme: light dark;
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      --row-height: 28px;
      --name-column: minmax(250px, 1.7fr);
      --side-column: minmax(150px, 1fr);
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--vscode-foreground); background: var(--vscode-editor-background); }
    button, input { font: inherit; }
    button {
      min-height: 28px;
      padding: 4px 10px;
      border: 1px solid var(--vscode-button-border, transparent);
      border-radius: 3px;
      color: var(--vscode-button-foreground);
      background: var(--vscode-button-background);
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
    button:disabled { cursor: default; opacity: .55; }
    button.secondary { color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); }
    button:focus-visible, input:focus-visible, [role="treeitem"]:focus-visible {
      outline: 2px solid var(--vscode-focusBorder);
      outline-offset: 1px;
    }
    main { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); height: 100vh; min-height: 0; }
    header { padding: 12px 16px 10px; border-bottom: 1px solid var(--vscode-panel-border); }
    h1 { margin: 0 0 7px; font-size: 18px; font-weight: 600; }
    .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; color: var(--vscode-descriptionForeground); }
    .side-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-name strong { color: var(--vscode-foreground); }
    .load-line { display: flex; align-items: center; gap: 8px; min-height: 26px; margin-top: 5px; }
    .load-line[aria-live] { color: var(--vscode-descriptionForeground); }
    .load-progress { width: 150px; height: 5px; border: 0; background: var(--vscode-progressBar-background); }
    .load-progress::-webkit-progress-bar { background: color-mix(in srgb, var(--vscode-progressBar-background) 22%, transparent); }
    .load-progress::-webkit-progress-value { background: var(--vscode-progressBar-background); }
    .stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .stat, .notice, .preview, .result, .details { border: 1px solid var(--vscode-panel-border); border-radius: 4px; padding: 6px 8px; }
    .stat { color: var(--vscode-descriptionForeground); }
    .comparison-info { display: grid; gap: 4px; margin-top: 8px; }
    .toolbar, .actionbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--vscode-panel-border); }
    .toolbar input[type="search"] {
      min-width: 180px;
      min-height: 28px;
      padding: 4px 8px;
      color: var(--vscode-input-foreground);
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
    }
    .strategy { display: inline-flex; flex-wrap: wrap; gap: 2px; }
    .strategy .active { outline: 1px solid var(--vscode-focusBorder); }
    .checkbox-label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .spacer { flex: 1 1 auto; }
    .muted, .reason { color: var(--vscode-descriptionForeground); }
    .error, .blocked, .destructive { color: var(--vscode-errorForeground); }
    .success { color: var(--vscode-testing-iconPassed); }
    .hidden { display: none !important; }

    .content { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto auto; min-height: 0; overflow: hidden; padding: 10px 16px 14px; gap: 8px; }
    .notice { background: var(--vscode-editorWidget-background); }
    .grid-header, .grid-row { display: grid; grid-template-columns: var(--name-column) var(--side-column) var(--side-column); }
    .grid-header { position: sticky; top: 0; z-index: 1; min-width: 620px; min-height: 32px; border-bottom: 1px solid var(--vscode-panel-border); background: var(--vscode-editor-background); }
    .grid-heading { overflow: hidden; padding: 7px 9px; color: var(--vscode-descriptionForeground); font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .grid-heading + .grid-heading { border-left: 1px solid var(--vscode-panel-border); }
    .tree-viewport { min-width: 0; min-height: 0; overflow: auto; border: 1px solid var(--vscode-panel-border); overscroll-behavior: contain; }
    .row-spacer { grid-column: 1 / -1; width: 1px; }
    .grid-row { height: var(--row-height); min-width: 620px; border-bottom: 1px solid var(--vscode-panel-border); }
    .grid-row:last-child { border-bottom: 0; }
    .grid-row:hover { background: var(--vscode-list-hoverBackground); }
    .grid-row[aria-selected="true"] { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); }
    .name-cell, .value-cell { display: flex; min-width: 0; height: var(--row-height); align-items: center; overflow: hidden; }
    .name-cell { gap: 5px; padding: 0 8px 0 calc(8px + var(--depth, 0) * 18px); }
    .value-cell { padding: 0 9px; border-left: 1px solid var(--vscode-panel-border); color: var(--vscode-descriptionForeground); }
    .value-cell.changed-value { background: var(--vscode-diffEditor-insertedLineBackground, var(--vscode-list-hoverBackground)); }
    .value-cell.missing-value { background: var(--vscode-diffEditor-removedLineBackground, var(--vscode-editor-inactiveSelectionBackground)); }
    .value-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .disclosure, .disclosure-spacer { flex: 0 0 18px; width: 18px; height: 20px; }
    .disclosure { min-height: 0; padding: 0; border: 0; color: var(--vscode-foreground); background: transparent; }
    .disclosure:hover { background: var(--vscode-toolbar-hoverBackground); }
    .row-check { flex: 0 0 auto; margin: 0 2px 0 0; }
    .row-label { min-width: 0; overflow: hidden; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .row-status { flex: 0 0 auto; max-width: 150px; overflow: hidden; margin-left: auto; color: var(--vscode-descriptionForeground); font-size: .9em; text-overflow: ellipsis; white-space: nowrap; }
    .row-status.blocked { color: var(--vscode-errorForeground); }
    .conflict-mark { flex: 0 0 auto; color: var(--vscode-errorForeground); font-weight: 700; }
    .details { align-self: start; max-height: 190px; overflow: auto; background: var(--vscode-editorWidget-background); }
    .details h2 { margin: 0 0 5px; font-size: 13px; }
    .details-grid { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 3px 10px; }
    .details-key { color: var(--vscode-descriptionForeground); }
    .details-value { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .preview, .result { display: grid; gap: 7px; background: var(--vscode-editorWidget-background); }
    .preview ul, .notice ul, .comparison-info ul { margin: 0; padding-left: 20px; }
    .destructive-warning { border-color: var(--vscode-inputValidation-errorBorder, var(--vscode-errorForeground)); color: var(--vscode-errorForeground); }
    .failure-list { overflow-wrap: anywhere; }

    @media (max-width: 760px) {
      :root { --name-column: minmax(220px, 1.4fr); --side-column: minmax(125px, 1fr); }
      .toolbar, .actionbar { padding-right: 10px; padding-left: 10px; }
      header { padding-right: 10px; padding-left: 10px; }
      .content { padding-right: 10px; padding-left: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="title">Сравнение конфигураций</h1>
      <div class="sides" id="comparisonSides">
        <div class="side-name"><strong>Приёмник:</strong> Конфигурация</div>
        <div class="side-name"><strong>Источник:</strong> Конфигурация</div>
      </div>
      <div class="load-line" id="loadLine" role="status" aria-live="polite"></div>
      <div class="stats" id="stats"></div>
      <div class="comparison-info hidden" id="comparisonInfo"></div>
    </header>
    <section class="toolbar" aria-label="Фильтры и выбор">
      <span class="strategy" id="strategyControls" aria-label="Стратегия сравнения">
        <button class="secondary" data-strategy="left" title="Показывать различия, относящиеся к приёмнику">Только приёмник</button>
        <button class="secondary" data-strategy="right" title="Показывать различия, относящиеся к источнику">Только источник</button>
        <button class="secondary" data-strategy="full" title="Показывать изменения обеих сторон">Все объекты</button>
      </span>
      <label class="checkbox-label"><input id="onlyDifferences" type="checkbox" checked> Только различия</label>
      <input id="searchInput" type="search" placeholder="Поиск по имени, пути или UUID" aria-label="Поиск по дереву">
      <button id="selectVisibleButton" class="secondary">Выбрать видимые</button>
      <button id="clearSelectionButton" class="secondary">Снять выбор</button>
    </section>
    <section class="actionbar" aria-label="Действия сравнения">
      <button id="previewButton" disabled>Просмотреть изменения</button>
      <button id="approveButton" class="secondary" disabled>Подтвердить изменения</button>
      <button id="executeButton" disabled>Выполнить объединение</button>
      <button id="refreshButton" class="secondary">Обновить</button>
      <button id="cancelButton" class="secondary hidden">Отменить проверку</button>
      <button id="retryButton" class="secondary hidden">Повторить</button>
      <button id="closeButton" class="secondary">Закрыть</button>
      <span class="spacer"></span>
      <span class="muted" id="selectionText"></span>
    </section>
    <section class="content">
      <div class="notice hidden" id="notice"></div>
      <section class="preview hidden" id="preview"></section>
      <div class="tree-viewport" id="viewport" role="tree" tabindex="0" aria-label="Дерево различий">
        <div class="grid-header" aria-hidden="true">
          <div class="grid-heading">Объект и состояние</div>
          <div class="grid-heading" id="targetHeading">Приёмник</div>
          <div class="grid-heading" id="sourceHeading">Источник</div>
        </div>
        <div id="rows"></div>
      </div>
      <aside class="details hidden" id="details" aria-label="Сведения об объекте"></aside>
      <section class="result hidden" id="result"></section>
    </section>
  </main>
  <script nonce="${nonce}">
    // __CONFIG_COMPARE_DATA_PLACEHOLDER__
    // __CONFIG_COMPARE_LOAD_PLACEHOLDER__
    const vscode = acquireVsCodeApi();
    const ROW_HEIGHT = 28;
    const OVERSCAN = 8;
    const phaseLabels = {
      detecting: 'Определение состава конфигураций',
      metadata: 'Чтение метаданных',
      inventory: 'Индексирование файлов',
      bsl: 'Сравнение модулей BSL',
      comparing: 'Сравнение объектов',
      projecting: 'Построение дерева',
    };
    const statusLabels = {
      equal: 'Совпадает',
      changed: 'Есть изменения',
      leftOnly: 'Только приёмник',
      rightOnly: 'Только источник',
    };
    const mergeLabels = {
      ready: 'Доступно',
      blocked: 'Заблокировано',
      identityConflict: 'Конфликт идентичности',
      readOnly: 'Только чтение',
    };
    const state = {
      payload: window.__configCompareData,
      selectedNodeIds: [],
      selectedIds: new Set(),
      executableIds: new Set(window.__configCompareData?.executableNodeIds ?? []),
      busy: false,
      locked: Boolean(window.__configCompareData?.locked),
      preview: undefined,
      diagnostics: [],
      notice: undefined,
      onlyDifferences: true,
      search: '',
      loadState: window.__configCompareLoadState ?? { generation: 0, status: 'ready' },
      expanded: new Set(),
      knownKeys: new Set(),
      focusKey: undefined,
      detailKey: undefined,
      visibleRows: [],
      visibleCandidateIds: [],
      included: new Map(),
      nodesByKey: new Map(),
      initialized: false,
      generation: window.__configCompareLoadState?.generation ?? 0,
    };
    const elements = {
      title: document.getElementById('title'),
      comparisonSides: document.getElementById('comparisonSides'),
      targetHeading: document.getElementById('targetHeading'),
      sourceHeading: document.getElementById('sourceHeading'),
      loadLine: document.getElementById('loadLine'),
      stats: document.getElementById('stats'),
      comparisonInfo: document.getElementById('comparisonInfo'),
      strategyControls: document.getElementById('strategyControls'),
      strategyButtons: [...document.querySelectorAll('[data-strategy]')],
      onlyDifferences: document.getElementById('onlyDifferences'),
      searchInput: document.getElementById('searchInput'),
      selectVisibleButton: document.getElementById('selectVisibleButton'),
      clearSelectionButton: document.getElementById('clearSelectionButton'),
      previewButton: document.getElementById('previewButton'),
      approveButton: document.getElementById('approveButton'),
      executeButton: document.getElementById('executeButton'),
      refreshButton: document.getElementById('refreshButton'),
      cancelButton: document.getElementById('cancelButton'),
      retryButton: document.getElementById('retryButton'),
      closeButton: document.getElementById('closeButton'),
      selectionText: document.getElementById('selectionText'),
      viewport: document.getElementById('viewport'),
      gridHeader: document.querySelector('.grid-header'),
      rows: document.getElementById('rows'),
      notice: document.getElementById('notice'),
      details: document.getElementById('details'),
      preview: document.getElementById('preview'),
      result: document.getElementById('result'),
    };

    elements.strategyButtons.forEach((button) => button.addEventListener('click', () => {
      if (!isInteractive()) return;
      vscode.postMessage({ type: 'setStrategy', strategy: button.dataset.strategy });
    }));
    elements.onlyDifferences.addEventListener('change', () => {
      state.onlyDifferences = elements.onlyDifferences.checked;
      renderTree();
      renderToolbar();
    });
    elements.searchInput.addEventListener('input', () => {
      state.search = elements.searchInput.value.trim().toLocaleLowerCase('ru');
      renderTree();
      renderToolbar();
    });
    elements.selectVisibleButton.addEventListener('click', () => {
      const selected = state.visibleCandidateIds;
      if (selected.length) vscode.postMessage({ type: 'selectionChanged', nodeIds: selected });
    });
    elements.clearSelectionButton.addEventListener('click', () => vscode.postMessage({ type: 'selectionChanged', nodeIds: [] }));
    elements.previewButton.addEventListener('click', () => {
      if (isInteractive()) vscode.postMessage({ type: 'createPreview', nodeIds: selectedExecutableIds() });
    });
    elements.approveButton.addEventListener('click', () => {
      if (isInteractive() && state.preview) vscode.postMessage({ type: 'approvePreview', previewId: state.preview.previewId });
    });
    elements.executeButton.addEventListener('click', () => {
      if (!isInteractive() || !state.preview) return;
      const destructive = (state.preview.destructiveCount ?? 0) > 0;
      const confirmed = !destructive || confirm('В объединении есть удаление или перезапись файлов. Выполнить?');
      if (confirmed) vscode.postMessage({ type: 'executeMerge', previewId: state.preview.previewId, destructiveConfirmed: confirmed });
    });
    elements.refreshButton.addEventListener('click', () => {
      if (isInteractive()) vscode.postMessage({ type: 'refresh' });
    });
    elements.cancelButton.addEventListener('click', () => vscode.postMessage({ type: 'cancel' }));
    elements.retryButton.addEventListener('click', () => vscode.postMessage({ type: 'retry' }));
    elements.closeButton.addEventListener('click', () => vscode.postMessage({ type: 'close' }));
    elements.viewport.addEventListener('scroll', renderWindow, { passive: true });
    elements.viewport.addEventListener('keydown', onTreeKeyDown);
    let windowRenderFrame;
    const scheduleWindowRender = () => {
      if (windowRenderFrame !== undefined) return;
      windowRenderFrame = requestAnimationFrame(() => {
        windowRenderFrame = undefined;
        renderWindow();
      });
    };
    if (typeof ResizeObserver !== 'undefined') {
      const viewportObserver = new ResizeObserver(scheduleWindowRender);
      viewportObserver.observe(elements.viewport);
    }
    window.addEventListener('resize', scheduleWindowRender);

    window.addEventListener('message', (event) => {
      const message = event.data;
      if (!message || typeof message.type !== 'string') return;
      if (message.type === 'loadState') {
        if (typeof message.generation === 'number' && message.generation < state.generation) return;
        state.generation = message.generation ?? state.generation;
        state.loadState = message;
        if (message.payload) setPayload(message.payload);
        if (message.status === 'loading') {
          state.locked = true;
          state.preview = undefined;
        } else if (message.status === 'ready') {
          state.locked = Boolean(message.payload?.locked);
        } else {
          state.locked = true;
        }
        render();
        return;
      }
      if (message.type === 'state') {
        if (state.loadState.status !== 'ready') return;
        setPayload(message.payload);
        state.selectedNodeIds = message.selectedNodeIds ?? [];
        state.selectedIds = new Set(state.selectedNodeIds);
        state.busy = Boolean(message.busy);
        state.locked = Boolean(message.locked);
        state.preview = message.preview;
        state.diagnostics = message.diagnostics ?? [];
        state.notice = undefined;
        render();
        return;
      }
      if (message.type === 'previewReady') {
        if (state.loadState.status !== 'ready') return;
        state.preview = message;
        state.diagnostics = message.diagnostics ?? [];
        state.notice = undefined;
        render();
        return;
      }
      if (message.type === 'mergeSuccess') {
        if (state.loadState.status !== 'ready') return;
        setPayload(message.payload);
        state.locked = Boolean(message.locked);
        state.preview = undefined;
        state.selectedNodeIds = [];
        state.diagnostics = message.diagnostics ?? [];
        state.notice = undefined;
        renderResult(message);
        render();
        return;
      }
      if (message.type === 'mergeError') {
        if (state.loadState.status !== 'ready') return;
        state.locked = Boolean(message.locked);
        state.diagnostics = message.diagnostics ?? [];
        state.notice = message.mutationFailure?.message ?? message.message;
        if ((message.backupPaths?.length ?? 0) > 0 || message.mutationFailure) {
          renderFailureBackups(message.backupPaths ?? [], message.mutationFailure);
        }
        render();
      }
    });

    function setPayload(payload) {
      state.payload = payload;
      state.executableIds = new Set(payload?.executableNodeIds ?? []);
      state.nodesByKey.clear();
      if (!payload?.root) return;
      const stack = [payload.root];
      while (stack.length) {
        const node = stack.pop();
        state.nodesByKey.set(node.key, node);
        if (!state.knownKeys.has(node.key) && shouldExpandByDefault(node)) state.expanded.add(node.key);
        state.knownKeys.add(node.key);
        for (let i = node.children.length - 1; i >= 0; i -= 1) stack.push(node.children[i]);
      }
      if (state.detailKey && !state.nodesByKey.has(state.detailKey)) state.detailKey = undefined;
      state.initialized = true;
    }

    function shouldExpandByDefault(node) {
      return node.kind === 'displayRoot' || node.kind === 'displayGroup' || node.kind === 'metadataTypeGroup' || node.kind === 'diagnosticsGroup'
        || (node.children ?? []).some((child) => child.kind === 'metadataTypeGroup');
    }

    function isInteractive() {
      return state.loadState.status === 'ready' && !state.busy && !state.locked;
    }

    function selectedExecutableIds() {
      const executable = new Set(state.payload?.executableNodeIds ?? []);
      return state.selectedNodeIds.filter((id) => executable.has(id));
    }

    function render() {
      const payload = state.payload;
      elements.title.textContent = payload?.title ?? 'Сравнение конфигураций';
      const targetLabel = payload?.targetLabel ?? 'Конфигурация';
      const sourceLabel = payload?.sourceLabel ?? 'Конфигурация';
      elements.comparisonSides.replaceChildren(
        sideHeading('Приёмник', targetLabel),
        sideHeading('Источник', sourceLabel)
      );
      elements.targetHeading.textContent = targetLabel;
      elements.sourceHeading.textContent = sourceLabel;
      elements.strategyControls.classList.toggle('hidden', payload?.comparisonInfo?.mode === 'extension');
      renderLoadLine();
      renderStats(payload?.stats);
      renderComparisonInfo(payload?.comparisonInfo);
      renderToolbar();
      renderNotice();
      renderPreview();
      renderTree();
      renderDetails();
    }

    function sideHeading(label, value) {
      const element = document.createElement('div');
      element.className = 'side-name';
      const strong = document.createElement('strong');
      strong.textContent = `${label}: `;
      const name = document.createElement('span');
      name.textContent = value;
      name.title = value;
      element.append(strong, name);
      return element;
    }

    function renderLoadLine() {
      const load = state.loadState ?? { status: 'ready' };
      elements.loadLine.classList.remove('error');
      elements.loadLine.replaceChildren();
      let text = '';
      if (load.status === 'loading') {
        const progress = document.createElement('progress');
        progress.className = 'load-progress';
        progress.max = Number.isFinite(load.total) && load.total > 0 ? load.total : 1;
        if (Number.isFinite(load.completed) && Number.isFinite(load.total) && load.total > 0) {
          progress.value = Math.min(load.completed, load.total);
        } else {
          progress.removeAttribute('value');
        }
        progress.setAttribute('aria-label', phaseLabels[load.phase] ?? 'Проверка конфигураций');
        elements.loadLine.append(progress);
        text = `${phaseLabels[load.phase] ?? 'Проверка'} · ${formatProgress(load)}. Показанные данные промежуточные.`;
      } else if (load.status === 'cancelled') {
        text = 'Проверка отменена. Показанные данные не завершены.';
      } else if (load.status === 'error') {
        text = load.error ?? 'Не удалось сравнить конфигурации.';
        elements.loadLine.classList.add('error');
      } else if (state.busy) {
        text = 'Выполняется действие сравнения…';
      } else {
        text = state.locked ? 'Действия заблокированы. Обновите сравнение.' : 'Сравнение готово';
        elements.loadLine.classList.remove('error');
      }
      const label = document.createElement('span');
      label.textContent = text;
      elements.loadLine.append(label);
      elements.cancelButton.classList.toggle('hidden', load.status !== 'loading');
      elements.retryButton.classList.toggle('hidden', !((load.status === 'error' || load.status === 'cancelled') && load.retryAvailable));
    }

    function formatProgress(load) {
      return Number.isFinite(load.completed) && Number.isFinite(load.total) && load.total > 0
        ? `${load.completed} из ${load.total}`
        : 'выполняется';
    }

    function renderStats(stats) {
      elements.stats.replaceChildren();
      if (state.loadState.status !== 'ready') {
        if (state.loadState.status === 'loading' && state.loadState.partial) {
          elements.stats.append(stat('Промежуточно', 'результат уточняется'));
        }
        return;
      }
      if (!stats) return;
      elements.stats.append(stat('Всего элементов', stats.total), stat('С различиями', stats.different), stat('Доступно к выбору', stats.mergeable));
    }

    function stat(label, value) {
      const element = document.createElement('div');
      element.className = 'stat';
      element.textContent = `${label}: ${value}`;
      return element;
    }

    function renderComparisonInfo(info) {
      elements.comparisonInfo.classList.toggle('hidden', !info);
      if (!info) {
        elements.comparisonInfo.replaceChildren();
        return;
      }
      const title = document.createElement('strong');
      title.textContent = 'Сравнение расширений конфигурации';
      const sides = document.createElement('div');
      sides.textContent = `Приёмник: ${info.targetLabel} · Источник: ${info.sourceLabel}`;
      const limitations = document.createElement('ul');
      for (const limitation of info.limitations ?? []) {
        const item = document.createElement('li');
        item.textContent = limitation;
        limitations.append(item);
      }
      elements.comparisonInfo.replaceChildren(title, sides, limitations);
    }

    function renderToolbar() {
      const ready = state.loadState.status === 'ready';
      const selected = state.selectedNodeIds.filter((id) => state.executableIds.has(id));
      const actionable = ready && !state.busy && !state.locked;
      elements.strategyButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.strategy === state.payload?.strategy);
        button.disabled = !actionable;
      });
      elements.onlyDifferences.disabled = !state.payload?.root;
      elements.searchInput.disabled = !state.payload?.root;
      elements.previewButton.disabled = !actionable || selected.length === 0;
      elements.approveButton.disabled = !actionable || !state.preview || Boolean(state.preview.approved);
      elements.executeButton.disabled = !actionable || !state.preview?.approved;
      elements.refreshButton.disabled = !ready || state.busy;
      elements.selectVisibleButton.disabled = !actionable || state.visibleCandidateIds.length === 0;
      elements.clearSelectionButton.disabled = !actionable || selected.length === 0;
      elements.selectionText.textContent = state.locked
        ? 'Состояние заблокировано; обновите сравнение.'
        : selected.length === 0
          ? 'Выберите доступные объекты для просмотра изменений.'
          : selected.length === 1 ? 'Выбран 1 элемент.' : `Выбрано элементов: ${selected.length}.`;
    }

    function renderTree() {
      const root = state.payload?.root;
      state.included.clear();
      state.visibleRows = [];
      if (!root) {
        elements.rows.replaceChildren();
        elements.viewport.scrollTop = 0;
        return;
      }
      markIncluded(root);
      const searching = state.search.length > 0;
      const visit = (node, depth) => {
        if (!state.included.get(node.key)) return;
        state.visibleRows.push({ node, depth });
        const expandForSearch = searching && node.children.some((child) => state.included.get(child.key));
        if (node.children.length && (state.expanded.has(node.key) || expandForSearch)) {
          for (const child of node.children) visit(child, depth + 1);
        }
      };
      for (const child of root.children) visit(child, 0);
      state.visibleCandidateIds = unique(state.visibleRows.flatMap((entry) => entry.node.candidateNodeIds ?? []))
        .filter((id) => state.executableIds.has(id));
      renderWindow();
    }

    function markIncluded(node) {
      let childIncluded = false;
      for (const child of node.children ?? []) childIncluded = markIncluded(child) || childIncluded;
      const matchesText = !state.search || searchableText(node).includes(state.search);
        const matchesDifference = !state.onlyDifferences || node.status !== 'equal' || Boolean(node.conflict) || node.mergeState?.state === 'identityConflict';
      const include = (matchesText && matchesDifference) || childIncluded;
      state.included.set(node.key, include);
      return include;
    }

    function searchableText(node) {
      const values = [node.label, node.kind, node.status, node.leftValue, node.rightValue, node.mergeState?.reason, node.conflict?.message];
      for (const identity of node.identities ?? []) {
        values.push(identity.qualifiedName, identity.uuid, identity.sourceUuid, identity.filePath, identity.ownership);
      }
      return values.filter(Boolean).join(' ').toLocaleLowerCase('ru');
    }

    function renderWindow() {
      const rows = state.visibleRows;
      const headerHeight = elements.gridHeader.getBoundingClientRect().height || 0;
      const contentHeight = headerHeight + rows.length * ROW_HEIGHT;
      const maxScrollTop = Math.max(0, contentHeight - elements.viewport.clientHeight);
      if (elements.viewport.scrollTop > maxScrollTop) elements.viewport.scrollTop = maxScrollTop;
      const rowScrollTop = Math.max(0, elements.viewport.scrollTop - headerHeight);
      const visibleHeight = Math.max(0, elements.viewport.clientHeight - headerHeight);
      const first = Math.max(0, Math.floor(rowScrollTop / ROW_HEIGHT) - OVERSCAN);
      const last = Math.min(rows.length, Math.ceil((rowScrollTop + visibleHeight) / ROW_HEIGHT) + OVERSCAN);
      const parts = [];
      parts.push(spacer(first * ROW_HEIGHT));
      for (let i = first; i < last; i += 1) parts.push(renderRow(rows[i], i));
      parts.push(spacer(Math.max(0, rows.length - last) * ROW_HEIGHT));
      elements.rows.replaceChildren(...parts);
      if (state.pendingFocusKey) {
        const row = [...elements.rows.querySelectorAll('[role="treeitem"]')].find((item) => item.dataset.key === state.pendingFocusKey);
        if (row) row.focus({ preventScroll: true });
        state.pendingFocusKey = undefined;
      }
      renderToolbar();
    }

    function spacer(height) {
      const element = document.createElement('div');
      element.className = 'row-spacer';
      element.setAttribute('aria-hidden', 'true');
      element.style.height = `${height}px`;
      return element;
    }

    function renderRow(entry, index) {
      const { node, depth } = entry;
      const row = document.createElement('div');
      row.className = 'grid-row';
      row.setAttribute('role', 'treeitem');
      row.setAttribute('aria-level', String(depth + 1));
      row.setAttribute('aria-posinset', String(index + 1));
      row.setAttribute('aria-selected', String(node.key === state.detailKey));
      if (node.children.length) row.setAttribute('aria-expanded', String(state.expanded.has(node.key) || state.search.length > 0));
      row.dataset.key = node.key;
      row.tabIndex = -1;
      row.style.setProperty('--depth', String(depth));
      const name = document.createElement('div');
      name.className = 'name-cell';
      if (node.children.length) {
        const disclosure = document.createElement('button');
        disclosure.className = 'disclosure';
        disclosure.textContent = state.expanded.has(node.key) || state.search ? '▾' : '▸';
        disclosure.setAttribute('aria-label', state.expanded.has(node.key) ? 'Свернуть' : 'Развернуть');
        disclosure.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleExpanded(node.key);
        });
        name.append(disclosure);
      } else {
        const spacerCell = document.createElement('span');
        spacerCell.className = 'disclosure-spacer';
        name.append(spacerCell);
      }
      const candidates = (node.candidateNodeIds ?? []).filter((id) => state.executableIds.has(id));
      if (candidates.length) {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'row-check';
        checkbox.disabled = !isInteractive();
        const selected = candidates.filter((id) => state.selectedNodeIds.includes(id)).length;
        checkbox.checked = selected === candidates.length;
        checkbox.indeterminate = selected > 0 && selected < candidates.length;
        checkbox.setAttribute('aria-label', `Выбрать ${node.label}`);
        checkbox.addEventListener('click', (event) => event.stopPropagation());
        checkbox.addEventListener('change', () => updateSelection(candidates, checkbox.checked));
        name.append(checkbox);
      }
      const label = document.createElement('span');
      label.className = 'row-label';
      label.textContent = node.label;
      label.title = node.label;
      name.append(label);
      if (node.conflict || node.mergeState?.state === 'identityConflict') {
        const mark = document.createElement('span');
        mark.className = 'conflict-mark';
        mark.textContent = '⚠';
        mark.setAttribute('aria-label', 'Конфликт идентичности');
        name.append(mark);
      }
      const status = document.createElement('span');
      status.className = `row-status${node.mergeState?.state === 'blocked' || node.mergeState?.state === 'identityConflict' ? ' blocked' : ''}`;
      status.textContent = rowStatus(node);
      status.title = rowStatus(node);
      name.append(status);
      row.append(name, valueCell(node, 'left'), valueCell(node, 'right'));
      row.addEventListener('click', () => {
        state.detailKey = node.key;
        state.focusKey = node.key;
        renderDetails();
        [...elements.rows.querySelectorAll('[role="treeitem"]')].forEach((item) => item.setAttribute('aria-selected', String(item.dataset.key === node.key)));
      });
      row.addEventListener('focus', () => {
        state.focusKey = node.key;
        state.detailKey = node.key;
        renderDetails();
      });
      return row;
    }

    function valueCell(node, side) {
      const cell = document.createElement('div');
      cell.className = 'value-cell';
      const value = document.createElement('span');
      value.className = 'value-text';
      const raw = side === 'left' ? node.leftValue : node.rightValue;
      const missing = (side === 'left' && node.status === 'rightOnly') || (side === 'right' && node.status === 'leftOnly');
      if (missing) cell.classList.add('missing-value');
      else if (node.status === 'changed' && raw) cell.classList.add('changed-value');
      value.textContent = missing ? 'Нет на стороне' : raw || '—';
      value.title = value.textContent;
      cell.append(value);
      return cell;
    }

    function rowStatus(node) {
      const status = state.loadState.status === 'loading' ? 'Промежуточно' : statusLabels[node.status] ?? 'Состояние не указано';
      const merge = node.mergeState?.state ? ` · ${mergeLabels[node.mergeState.state] ?? node.mergeState.state}` : '';
      return `${status}${merge}`;
    }

    function updateSelection(ids, checked) {
      if (!isInteractive()) return;
        const selected = new Set(state.selectedIds);
      for (const id of ids) checked ? selected.add(id) : selected.delete(id);
      state.selectedNodeIds = [...selected];
      state.selectedIds = selected;
      vscode.postMessage({ type: 'selectionChanged', nodeIds: state.selectedNodeIds });
      renderWindow();
    }

    function toggleExpanded(key) {
      if (state.expanded.has(key)) state.expanded.delete(key);
      else state.expanded.add(key);
      state.detailKey = key;
      renderTree();
      renderDetails();
    }

    function onTreeKeyDown(event) {
      const visible = state.visibleRows;
      if (!visible.length) return;
      const currentIndex = Math.max(0, visible.findIndex((entry) => entry.node.key === state.focusKey));
      const current = visible[currentIndex]?.node;
      if (!current) return;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        const nextIndex = Math.max(0, Math.min(visible.length - 1, currentIndex + (event.key === 'ArrowDown' ? 1 : -1)));
        focusRow(visible[nextIndex].node.key);
      } else if (event.key === 'ArrowRight') {
        if (current.children.length && !state.expanded.has(current.key)) {
          event.preventDefault();
          toggleExpanded(current.key);
          focusRow(current.key);
        } else if (current.children.length) {
          event.preventDefault();
          const next = visible[currentIndex + 1];
          if (next && next.depth > visible[currentIndex].depth) focusRow(next.node.key);
        }
      } else if (event.key === 'ArrowLeft') {
        if (current.children.length && state.expanded.has(current.key)) {
          event.preventDefault();
          toggleExpanded(current.key);
          focusRow(current.key);
        } else {
          const parent = findVisibleParent(currentIndex);
          if (parent) {
            event.preventDefault();
            focusRow(parent.node.key);
          }
        }
      } else if (event.key === 'F8') {
        event.preventDefault();
        const next = findNextDifference(currentIndex);
        if (next >= 0) focusRow(visible[next].node.key);
      } else if (event.key === ' ' && (current.candidateNodeIds ?? []).length) {
        event.preventDefault();
        const ids = current.candidateNodeIds.filter((id) => state.executableIds.has(id));
        const allSelected = ids.length > 0 && ids.every((id) => state.selectedNodeIds.includes(id));
        updateSelection(ids, !allSelected);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        state.detailKey = current.key;
        renderDetails();
      }
    }

    function findVisibleParent(index) {
      const depth = state.visibleRows[index].depth;
      for (let i = index - 1; i >= 0; i -= 1) if (state.visibleRows[i].depth < depth) return state.visibleRows[i];
      return undefined;
    }

    function findNextDifference(index) {
      const rows = state.visibleRows;
      for (let offset = 1; offset <= rows.length; offset += 1) {
        const candidate = rows[(index + offset) % rows.length].node;
        if (candidate.status !== 'equal' || candidate.conflict || candidate.mergeState?.state === 'identityConflict') {
          return (index + offset) % rows.length;
        }
      }
      return -1;
    }

    function focusRow(key) {
      const index = state.visibleRows.findIndex((entry) => entry.node.key === key);
      if (index < 0) return;
      state.focusKey = key;
      state.detailKey = key;
      const top = index * ROW_HEIGHT;
      const bottom = top + ROW_HEIGHT;
      if (top < elements.viewport.scrollTop) elements.viewport.scrollTop = top;
      else if (bottom > elements.viewport.scrollTop + elements.viewport.clientHeight) elements.viewport.scrollTop = bottom - elements.viewport.clientHeight;
      renderWindow();
      state.pendingFocusKey = key;
      renderWindow();
      renderDetails();
    }

    function renderDetails() {
      const node = state.nodesByKey.get(state.detailKey);
      elements.details.classList.toggle('hidden', !node);
      if (!node) {
        elements.details.replaceChildren();
        return;
      }
      const title = document.createElement('h2');
      title.textContent = node.label;
      const grid = document.createElement('div');
      grid.className = 'details-grid';
      detailField(grid, 'Состояние', statusLabels[node.status] ?? node.status);
      if (node.kind) detailField(grid, 'Тип узла', russianKind(node.kind));
      if (node.mergeState?.state) detailField(grid, 'Доступность', mergeLabels[node.mergeState.state] ?? node.mergeState.state);
      if (node.mergeState?.reason) detailField(grid, 'Причина', node.mergeState.reason);
      if (node.conflict?.message && node.conflict.message !== node.mergeState?.reason) detailField(grid, 'Конфликт', node.conflict.message);
      for (const identity of node.identities ?? []) {
        const side = identity.side === 'left' ? 'Приёмник' : 'Источник';
        const prefix = identity.ownership === 'adopted' ? `${side}, заимствованный объект` : identity.ownership === 'own' ? `${side}, собственный объект` : side;
        detailField(grid, `${prefix}: имя`, identity.qualifiedName);
        if (identity.uuid) detailField(grid, `${prefix}: UUID`, identity.uuid);
        if (identity.sourceUuid) detailField(grid, `${prefix}: UUID базового объекта`, identity.sourceUuid);
        if (identity.filePath) detailField(grid, `${prefix}: путь`, identity.filePath);
      }
      if (node.qualifiedNames?.length) detailField(grid, 'Квалифицированные имена', node.qualifiedNames.join('\n'));
      elements.details.replaceChildren(title, grid);
    }

    function detailField(parent, label, value) {
      if (!value) return;
      const key = document.createElement('span');
      key.className = 'details-key';
      key.textContent = label;
      const text = document.createElement('span');
      text.className = 'details-value';
      text.textContent = String(value);
      parent.append(key, text);
    }

    function russianKind(kind) {
      const labels = {
        metadataOwner: 'Объект метаданных', extensionMetadataObject: 'Объект расширения',
        xmlProperty: 'Свойство XML', bslRoutine: 'Процедура или функция BSL',
        diagnosticsGroup: 'Диагностика', displayGroup: 'Группа объектов', displayRoot: 'Корень сравнения',
        metadataTypeGroup: 'Тип метаданных', extensionSemanticFile: 'Файл расширения',
      };
      return labels[kind] ?? kind;
    }

    function renderNotice() {
      const hasNotice = state.diagnostics.length > 0 || Boolean(state.notice);
      elements.notice.classList.toggle('hidden', !hasNotice);
      if (!hasNotice) {
        elements.notice.replaceChildren();
        return;
      }
      const list = document.createElement('ul');
      if (state.notice) {
        const item = document.createElement('li');
        item.className = 'error';
        item.textContent = state.notice;
        list.append(item);
      }
      for (const diagnostic of state.diagnostics) {
        const item = document.createElement('li');
        item.className = diagnostic.severity === 'error' ? 'error' : '';
        item.textContent = diagnostic.suggestedAction ?? diagnostic.code;
        list.append(item);
      }
      elements.notice.replaceChildren(list);
    }

    function renderPreview() {
      const preview = state.preview;
      elements.preview.classList.toggle('hidden', !preview);
      if (!preview) {
        elements.preview.replaceChildren();
        return;
      }
      const title = document.createElement('strong');
      title.textContent = preview.approved ? 'Preview подтверждён' : 'Preview изменений';
      const summary = document.createElement('div');
      summary.textContent = `${preview.summary} Операций: ${preview.operationCount}`;
      const warning = document.createElement('div');
      warning.className = 'notice destructive-warning';
      warning.textContent = `Операций с удалением или перезаписью: ${preview.destructiveCount ?? 0}.`;
      warning.classList.toggle('hidden', (preview.destructiveCount ?? 0) === 0);
      const list = document.createElement('ul');
      for (const item of preview.items ?? []) {
        const li = document.createElement('li');
        li.className = item.destructive ? 'destructive' : '';
        li.textContent = `${item.label} (${item.kind}, ${statusLabels[item.status] ?? item.status})${item.previewPath ? ` → ${item.previewPath}` : ''}`;
        list.append(li);
      }
      elements.preview.replaceChildren(title, summary, warning, list);
    }

    function renderResult(message) {
      const title = document.createElement('strong');
      title.className = message.locked ? 'error' : 'success';
      title.textContent = message.locked ? 'Объединение выполнено, но состояние не обновилось' : 'Объединение выполнено';
      const applied = document.createElement('div');
      applied.textContent = `Применено операций: ${message.applied.length}`;
      const backups = document.createElement('div');
      backups.className = 'failure-list';
      backups.textContent = message.backupPaths.length ? `Резервные копии: ${message.backupPaths.join(', ')}` : 'Резервных копий нет';
      elements.result.classList.remove('hidden');
      elements.result.replaceChildren(title, applied, backups);
    }

    function renderFailureBackups(backupPaths, mutationFailure) {
      const title = document.createElement('strong');
      title.className = 'error';
      title.textContent = mutationFailure?.effectPossible ? 'Результат объединения требует проверки' : backupPaths.length ? 'Объединение не выполнено; резервная копия сохранена' : 'Объединение не выполнено';
      const details = [];
      if (mutationFailure?.effectPossible) {
        const warning = document.createElement('div');
        warning.className = 'error';
        warning.textContent = mutationFailure.message;
        details.push(warning);
      }
      if (backupPaths.length) {
        const backups = document.createElement('div');
        backups.className = 'failure-list';
        backups.textContent = `Резервные копии: ${backupPaths.join(', ')}`;
        details.push(backups);
      }
      elements.result.classList.remove('hidden');
      elements.result.replaceChildren(title, ...details);
    }

    function unique(values) { return [...new Set(values)]; }

    setPayload(state.payload);
    render();
    scheduleWindowRender();
    vscode.postMessage({ type: 'ready' });
  </script>
</body>
</html>

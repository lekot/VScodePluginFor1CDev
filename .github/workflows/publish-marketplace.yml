name: Publish VS Code Marketplace

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish released VSIX
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test release asset validation
        run: node --test scripts/prepare-marketplace-release.test.cjs

      - name: Download and validate release VSIX
        id: release-vsix
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          VSIX_PATH: ${{ runner.temp }}/marketplace-release.vsix
        run: node scripts/prepare-marketplace-release.cjs

      - name: Verify vsce version
        run: |
          version="$(npm exec --yes --package=@vscode/vsce@4.0.1-1 -- vsce --version)"
          if [ "$version" != "4.0.1-1" ]; then
            echo "::error::Expected @vscode/vsce 4.0.1-1, got $version"
            exit 1
          fi

      - name: Publish the release artifact
        env:
          VSIX_PATH: ${{ steps.release-vsix.outputs.vsix_path }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node scripts/publish-marketplace-release.cjs
